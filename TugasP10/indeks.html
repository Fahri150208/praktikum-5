<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"> 
    <title>Praktikum JavaScript</title>
</head>
<body>
    <h2>Praktikum Basic JavaScript</h2>
    <p>Lihat hasil melalui Console (F12).</p>
    
    <script>
        const nama = "Akbar"; 
        const tugas = 80;
        const uts = 70;
        const uas = 90;

        const nilaiAkhir = (tugas * 0.30) + (uts * 0.30) + (uas * 0.40);

        let statusKelulusan;
        if (nilaiAkhir >= 60) {
            statusKelulusan = "LULUS";
        } else {
            statusKelulusan = "TIDAK LULUS";
        }

        console.log("Nama Mahasiswa:", nama);
        console.log("Nilai Akhir:", nilaiAkhir);
        console.log("Status Kelulusan:", statusKelulusan);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Form Penilaian Mahasiswa</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f5fa;
      margin: 0;
      padding: 40px 16px;
    }
    .kartu {
      max-width: 420px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    h2 { margin-top: 0; color: #1a4f9c; }
    label { display: block; margin: 12px 0 4px; font-weight: bold; }
    input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #b5bfd0;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      margin-top: 16px;
      padding: 10px 18px;
      background: #1a4f9c;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: #143d79; }
    #hasil { margin-top: 18px; font-weight: bold; min-height: 24px; }
    .lulus { color: #1b8a3a; }
    .tidak-lulus { color: #c62828; }
    .error { color: #c62828; }
  </style>
</head>
<body>
  <div class="kartu">
    <h2>Form Penilaian Mahasiswa</h2>

    <label for="nama">Nama Mahasiswa</label>
    <input id="nama" type="text" placeholder="Masukkan nama">

    <label for="nilai">Nilai (0–100)</label>
    <input id="nilai" type="number" placeholder="Masukkan nilai">

    <button id="btnProses">Proses Nilai</button>

    <p id="hasil"></p>
  </div>

  <script>
    const inputNama = document.getElementById("nama");
    const inputNilai = document.getElementById("nilai");
    const hasil = document.getElementById("hasil");

    // Function dengan parameter dan return: menentukan status kelulusan
    function tentukanStatus(nilai) {
      if (nilai >= 60) {
        return "Lulus";
      }
      return "Tidak Lulus";
    }

    // Menampilkan pesan pada halaman menggunakan textContent
    function tampilkanPesan(teks, kelas) {
      hasil.textContent = teks;
      hasil.className = kelas;
    }

    function prosesNilai() {
      const nama = inputNama.value.trim();
      const nilaiTeks = inputNilai.value.trim();

      // Validasi nama
      if (nama === "") {
        tampilkanPesan("Nama wajib diisi!", "error");
        return;
      }

      // Validasi nilai wajib diisi
      if (nilaiTeks === "") {
        tampilkanPesan("Nilai wajib diisi!", "error");
        return;
      }

      const nilai = Number(nilaiTeks);

      // Validasi rentang nilai 0–100
      if (isNaN(nilai) || nilai < 0 || nilai > 100) {
        tampilkanPesan("Nilai harus 0–100!", "error");
        return;
      }

      const status = tentukanStatus(nilai);
      const kelas = status === "Lulus" ? "lulus" : "tidak-lulus";
      tampilkanPesan(nama + " — " + nilai + " — " + status, kelas);
    }

    document.getElementById("btnProses").addEventListener("click", prosesNilai);
  </script>
</body>
</html>

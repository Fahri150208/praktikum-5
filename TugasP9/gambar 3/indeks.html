<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gambar 3 - Implementasi Box & Browser UI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: sans-serif;
            padding: 20px;
            background-color: #fff;
        }
        
        /* Browser UI Styling */
        .browser-window {
            border: 2px solid #555;
            width: 800px;
            max-width: 100%;
            margin: 0 auto;
        }
        .browser-header {
            background-color: #e0e0e0;
            border-bottom: 2px solid #555;
            padding: 5px 15px 10px;
        }
        .browser-title {
            text-align: center;
            font-size: 13px;
            color: #000;
            margin-bottom: 8px;
        }
        .browser-nav {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-icons {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            letter-spacing: 2px;
        }
        .address-bar {
            flex-grow: 1;
            background-color: #fff;
            border: 2px solid #555;
            padding: 4px 10px;
            font-size: 14px;
            color: #0066cc;
        }

        /* Content Layout Styling */
        .browser-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: #fff;
        }
        .row {
            display: flex;
            gap: 15px;
        }
        .box {
            border: 2px solid #333;
        }
        
        /* Warna & Ukuran */
        .box-green { background-color: #a9d18e; width: 100%; height: 90px; }
        .box-yellow { background-color: #ffe650; width: 25%; height: 140px; }
        .box-orange { background-color: #ff6b2b; width: 75%; height: 140px; }
        .box-blue { background-color: #4bd1ff; width: 75%; height: 140px; }
    </style>
</head>
<body>
    <div class="browser-window">
        <!-- Mock Browser Header -->
        <div class="browser-header">
            <div class="browser-title">Moqzilla</div>
            <div class="browser-nav">
                <div class="nav-icons">⬅ ➡ ↻</div>
                <div class="address-bar">http://box1.com</div>
            </div>
        </div>
        
        <!-- Konten Box -->
        <div class="browser-content">
            <div class="row">
                <div class="box box-green"></div>
            </div>
            <div class="row">
                <div class="box box-yellow"></div>
                <div class="box box-orange"></div>
            </div>
            <div class="row">
                <div class="box box-yellow"></div>
                <div class="box box-blue"></div>
            </div>
        </div>
    </div>
</body>
</html>
